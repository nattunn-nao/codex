[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp-adsorption-app"
version = "0.1.0"
description = "CMP adsorption structure search app with Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33",
  "ase>=3.22",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.scripts]
cmp-adsorption = "cmp_adsorption.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
